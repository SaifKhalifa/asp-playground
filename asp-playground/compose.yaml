services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides ConnectionStrings:Default from appsettings.json. "db" is the compose service name.
      ConnectionStrings__Default: Server=db,1433;Database=${DB_NAME:-DonationDb};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  sqldata:
